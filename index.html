<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JK Daily Control</title>

  <link rel="icon" type="image/png" href="JK.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f6f8;
    }

    .app-frame {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: calc(100% + 60px);
      border: 0;
      display: block;
      transform: translateY(-60px);
    }
  </style>
</head>

<body>

  <div class="app-frame">
    <iframe
      src="https://script.google.com/macros/s/AKfycbw0RS9kK2FVTwEdcKw7s5tnBDeQXS95qErlQQQLJqGITRVsrjU6LUAKc4ksaVJYQ_Om/exec"
      title="JK Daily Control">
    </iframe>
  </div>

</body>
</html>
